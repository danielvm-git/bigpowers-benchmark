exit_criteria:
- Every report has an inputs block with subject SHA, dirty flag, task-tree hashes,
  config hash and image digest.
- A dirty subject aborts exit 2 unless --allow-dirty.
- Preflight proves fixture fails and solution passes for every selected task before
  round 1.
- The runner reads from a detached worktree, not a mutable branch.
- The eval suite passes 100 consecutive local runs with fixed seeds and UTC.
risks:
- Preflight doubles the setup cost; cache by input digest to keep it cheap.
- Worktrees add cleanup failure modes; a trap must remove them even on SIGINT.
- Hashing large fixture trees can be slow; hash sorted paths and contents, exclude
  vendor dirs.
