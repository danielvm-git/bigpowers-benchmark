exit_criteria:
- At least 7 tasks have a vanilla pass rate in [0.2, 0.8].
- No shipped task prompt contains an implementation recipe (formula, helper name,
  object shape).
- Every stated requirement has a hidden test, including a boundary and a regression
  case.
evidence:
- 'bigpowers specs/benchmarks/TASK-REVIEW_LATEST.md: 0/14 tasks in the band.'
- 'bigpowers specs/benchmarks/HARDER-TASKS_LATEST.md: design rules for harder tasks.'
risks:
- Calibration costs tokens; run vanilla only and cache by input digest.
- De-prescribing a task can make it too hard; re-calibrate after every spec edit.
- Long-horizon tasks need multi-session fixtures; keep Node-only and offline.
