exit_criteria:
- bash scripts/run-ab-eval.sh --dry-run --bigpowers-root <checkout> runs from this
  repo.
- A k=1 smoke writes AB-<date>.json and ab-runs-<date>.jsonl with the old key set
  plus new keys.
- The app launches one harness run and renders its logs and report.
- bigpowers main has no A/B harness and points here.
