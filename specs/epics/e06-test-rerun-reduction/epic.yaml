status: planned
release: "v2.1.0"
bcps: 8
wsjf:
  business_value: 8
  time_criticality: 3
  risk_reduction: 5
  job_size: 5
  score: 3.2
depends_on: [e05]
stories:
  - id: e06s01
    title: "Hash test inputs and label repeated green runs"
    bcps: 3
    risk: P1
    status: planned
  - id: e06s02
    title: "Add an opt-in test guard and an ablation arm that proves no quality loss"
