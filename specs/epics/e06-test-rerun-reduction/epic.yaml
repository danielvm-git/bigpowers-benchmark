exit_criteria:
  - "Redundant green runs are reported per arm with a CI."
  - "The guard arm reduces redundant runs by at least 50% with a CI excluding zero."
  - "The guard arm does not lower pass, score, audit or quality."
evidence:
  - "bigpowers LEAN-VSM_LATEST.md: bigpowers runs 8.5 test runs vs 3.7 vanilla; redundant green runs +1.7 [1.1, 2.4]."
risks:
  - "A guard that skips a needed rerun is a correctness bug; require the last run to be green and the input hash to match."
  - "The hash must include test files, source files, package.json/lock and env-relevant config."
