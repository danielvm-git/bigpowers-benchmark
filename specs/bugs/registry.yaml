bugs:
  - id: BUG-2026-11-03-story-verify-e58-eval-flake
    title: Evaluation flake in story verification e58
    status: documented
    severity: high
    workaround: "Retry evaluation with clean cache"
  - id: BUG-2026-11-04-preflight-wrapper-workdir
    title: Preflight wrapper working directory mismatch
    status: resolved
    severity: medium
  - id: BUG-2026-11-06-semantic-release-vs-branch-protection
    title: semantic-release cannot push its version commit to a protected main
    status: fixed
    severity: high
    observed: '2026-11-06'
    detail: >
      With main protected (PR required + required status check), the release job
      fails at @semantic-release/git with GH006: "Changes must be made through a
      pull request" and "Required status check test is expected". The version
      commit carries [skip ci], so it can never satisfy its own required check.
      Reproduced with enforce_admins both on and off, so the Actions GITHUB_TOKEN
      does not bypass classic protection. A ruleset bypass for the GitHub Actions
      integration is rejected on a user-owned repository ("must be part of the
      ruleset source or owner organization"). No tag or release was published by
      the failed attempts; latest tag remains v1.3.5.
    blocker: >
      Resolving it needed a decision outside the previous run's authority: add a
      fine-grained PAT with protection bypass as a repository secret, drop the
      git plugin, or stop protecting main.
    fix: >
      Drop @semantic-release/git and @semantic-release/changelog from
      .releaserc.json. semantic-release core only pushes tags, and the
      HEAD-to-main push came solely from the git plugin. Tags and GitHub
      releases are still published, so branch protection can stay enforced.
    trade_off: >
      CHANGELOG.md is no longer committed by a release. Release notes remain the
      record of change in GitHub Releases. Restoring a rolling CHANGELOG.md needs
      a follow-up that opens a pull request from the release job.
    verify: >
      npx semantic-release --dry-run --no-ci on main resolves 1.3.6, creates the
      tag, and publishes via @semantic-release/github with no branch push.
    affected_runs: '42279882331 (release=failure); main required checks test and verify are green'
  - id: BUG-2026-11-06-macos-queue-timeout-cancels-ci
    title: macos runner queue time counts against the job timeout and cancels CI
    status: fixed
    severity: high
    observed: '2026-11-06'
    detail: >
      Run 42275074915 on main was cancelled with test=cancelled and no runner
      assigned, exactly 15 minutes after being queued (18:55:34 -> 19:10:35),
      matching timeout-minutes: 15. Re-running the same commit succeeded, so the
      code was never at fault. Queue congestion on macos-15 is the trigger.
    fix: "Raise timeout-minutes to 45 on the test and verify jobs; a real run is ~2 min."
    verify: "gh run view 42275074915 (rerun green: test=success verify=success release=success)"
  - id: BUG-2026-11-06-prepush-swift-test-flake
    title: Intermittent pre-push swift-test failure
    status: open
    severity: low
    observed: '2026-11-06'
    detail: >
      The pre-push hook reported swift-test failed while the same suite passed
      immediately before (preflight) and immediately after (manual run and the
      next push). The failing test name was not captured because lefthook
      truncated the output; 188 tests in 54 suites pass on repeat runs. Treat as
      a flake until a failing test name is captured on a red run.
    workaround: "Re-run the push; capture lefthook output verbatim on the next red run."
    next_step: "Run `lefthook run pre-push` in a loop to reproduce and name the test." 

# SCOPE tracking for the autonomous close-out run (2026-11-06).
# Tracker issue: #4 (CI/CD Template Consolidation). No new GitHub issues created.
scope_tracking:
  batch_1:
    - id: SCOPE-01-audit-remediation
      type: gap
      tracker: local   # all 30 adoption-readiness audit FAILs
      branch: chore/adoption-readiness-remediation
      pr: 8
      status: merged
      files:
        - specs/
        - .github/workflows/
        - CONVENTIONS.md
        - AGENTS.md
        - scripts/preflight.sh
      depends_on: []
      acceptance: "Every adoption-readiness audit FAIL lands on main with gates green."
      verify: "bash scripts/preflight.sh && bash scripts/validate-specs-yaml.sh && bash scripts/trace-stories.sh --strict"
      severity: high
  batch_2:
    - id: SCOPE-02-ticket-4-template-consolidation
      type: gap
      tracker: 4
      pr: 9
      status: merged
      files:
        - .github/workflows/test-build-release.yml
      depends_on: [SCOPE-01-audit-remediation]
      acceptance: "One canonical workflow file, no legacy ci.yml/release.yml, template base documented, yamllint clean, CI green."
      verify: "yamllint .github/workflows/test-build-release.yml && gh workflow view 'Test Build Release'"
      severity: high
      finding: >
        Issue #4 describes a 16->9 redesign to ci-cd-*.yml templates with a
        4-stage ci -> verify -> semantic-release -> deploy pipeline. Those
        templates do not exist in danielvm-git/.github. The current source of
        truth there is workflow-templates/test-build-release-*.yml (CHANGELOG
        4.3.1). The issue text is stale relative to the template repo.
  batch_3:
    - id: SCOPE-03-churn-regeneration
      type: docs
      tracker: local
      status: merged
      files:
        - specs/tech-architecture/tech-debt-hotspots.md
      depends_on: [SCOPE-01-audit-remediation]
      acceptance: "Hotspot table is regenerated from a stated window with the exact command."
      verify: "bash scripts/bp-churn-rank.sh --limit 10"
      severity: low
      finding: >
        The default 90-day window covers so little activity on this repository
        that every file reports one commit and nothing can be ranked. The chart
        was regenerated over the full history window instead, and the document
        now states the command and the window.
    - id: SCOPE-04-tdd-opener
      type: docs
      tracker: local
      status: merged
      files:
        - specs/verifications/story-authoring-red-test.md
      depends_on: [SCOPE-01-audit-remediation]
      acceptance: "First-task red-test rule recorded where the next story author will read it."
      verify: "rg -n 'Task 1 of every new story is a test' specs/verifications/story-authoring-red-test.md"
      severity: low
  batch_4:
    - id: SCOPE-05-v3-deploy-stage
      type: gap
      tracker: grimoire-check
      status: in_review
      files:
        - .github/workflows/deploy.yml
      depends_on: [SCOPE-02-ticket-4-template-consolidation]
      acceptance: "v3 CI/CD pair: test-build-release.yml plus a separate deploy.yml chained via workflow_run."
      verify: "yamllint .github/workflows/ && python3 -c \"import yaml,os; d=yaml.safe_load(open('.github/workflows/deploy.yml')); on=d.get('on') or d.get(True); assert 'workflow_run' in on and on['workflow_run']['workflows']==['Test Build Release']\""
      severity: medium
      finding: >
        The Grimoire check requires the workflow pair. This repository ships a
        standalone macOS app with no web deploy target, so deploy.yml resolves
        DEPLOY_TARGET and records a notice when it is unset instead of
        inventing a deployment.
