# story: e58s08
# Hard brownfield feature: add brand-specific percentage discount rule with spend threshold.
# Must preserve all existing discounts, allocate discounts strictly to brand items, and correctly compute tax.
id: ab-20
title: Add brand discount rule with spend threshold to orders pricing
kind: feature
spec_style: behavioural
requirements:
  - id: min-inclusive
    behaviour: "the minimum brand subtotal is inclusive"
    hidden: "the minimum brand subtotal is inclusive"
  - id: case-sensitive
    behaviour: "brand matching is case-sensitive"
    hidden: "brand matching is case-sensitive"
  - id: rounding
    behaviour: "the brand percentage rounds to the nearest cent"
    hidden: "a brand percentage rounds to the nearest cent"
  - id: no-code
    behaviour: "no code means no discount and no label"
    hidden: "no code means no discount and no label"
  - id: bulk-regression
    behaviour: "BULK still uses the quantity tiers"
    hidden: "regression: BULK still uses the quantity tiers"
  - id: bogo-regression
    behaviour: "BOGO-BOOKS still gives the cheapest book free"
    hidden: "regression: BOGO-BOOKS still gives the cheapest book free"
prompt: |
  Add support for brand-specific percentage discounts to the orders pricing module.
  See docs/SPEC-brand-discount.md for requirements and error message formats.
  Keep all existing tests in test/orders.test.js passing.
protected:
  - test/orders.test.js
grade: node --test test/*.test.js test-hidden/*.test.js
score: node --test --test-reporter=tap test-hidden/*.test.js
audit: node --test --test-reporter=tap test-audit/*.test.js
timeout_s: 1800
