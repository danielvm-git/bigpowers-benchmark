    behaviour: "cursor on a tie boundary skips the rest of the tie"
    hidden: "cursor on a tie boundary skips the rest of the tie"
  - id: validation
    behaviour: "invalid limits and cursors fail"
    hidden: "invalid limits and cursors fail"
  - id: empty
    behaviour: "empty feeds return a null cursor"
    hidden: "empty feeds return a null cursor"
